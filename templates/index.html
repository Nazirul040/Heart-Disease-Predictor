<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Failure Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeInAnimation 1s ease-in-out forwards;
        }

        @keyframes fadeInAnimation {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .heart-beat {
            animation: heartBeatAnimation 1.5s infinite ease-in-out;
        }

        @keyframes heartBeatAnimation {
            0%, 100% {
                transform: scale(1);
            }
            10%, 30% {
                transform: scale(0.9);
            }
            20%, 40%, 60%, 80% {
                transform: scale(1.1);
            }
            50%, 70%, 90% {
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-4xl mx-auto bg-slate-800/50 backdrop-blur-sm rounded-2xl shadow-2xl p-6 sm:p-8 md:p-10 fade-in border border-slate-700">

        <header class="text-center mb-8">
            <div class="flex justify-center items-center gap-4 mb-4">
                <svg class="w-12 h-12 text-red-500 heart-beat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-600">
                    Heart Failure Prediction
                </h1>
            </div>
            <p class="text-slate-400 max-w-2xl mx-auto">
                Please fill in the details below to get a prediction. This is a demonstration tool and not a substitute for professional medical advice.
            </p>
        </header>

        <form action="/" method="POST" id="prediction-form" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <div class="flex flex-col">
                    <label for="age" class="mb-2 font-medium text-slate-300">Age</label>
                    <input type="number" id="age" name="Age" placeholder="e.g., 54" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                </div>

                <div class="flex flex-col">
                    <label for="sex" class="mb-2 font-medium text-slate-300">Sex</label>
                    <select id="sex" name="Sex" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="chest-pain-type" class="mb-2 font-medium text-slate-300">Chest Pain Type</label>
                    <select id="chest-pain-type" name="ChestPainType" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="TA">Typical Angina</option>
                        <option value="ATA">Atypical Angina</option>
                        <option value="NAP">Non-Anginal Pain</option>
                        <option value="ASY">Asymptomatic</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="resting-bp" class="mb-2 font-medium text-slate-300">Resting BP (mm Hg)</label>
                    <input type="number" id="resting-bp" name="RestingBP" placeholder="e.g., 140" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                </div>

                <div class="flex flex-col">
                    <label for="cholesterol" class="mb-2 font-medium text-slate-300">Cholesterol (mm/dl)</label>
                    <input type="number" id="cholesterol" name="Cholesterol" placeholder="e.g., 239" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                </div>

                <div class="flex flex-col">
                    <label for="fasting-bs" class="mb-2 font-medium text-slate-300">Fasting Blood Sugar</label>
                    <select id="fasting-bs" name="FastingBS" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="0">&lt; 120 mg/dl</option>
                        <option value="1">&gt; 120 mg/dl</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="resting-ecg" class="mb-2 font-medium text-slate-300">Resting ECG</label>
                    <select id="resting-ecg" name="RestingECG" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="Normal">Normal</option>
                        <option value="ST">ST-T wave abnormality</option>
                        <option value="LVH">Left Ventricular Hypertrophy</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="max-hr" class="mb-2 font-medium text-slate-300">Max Heart Rate</label>
                    <input type="number" id="max-hr" name="MaxHR" placeholder="e.g., 172" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                </div>

                <div class="flex flex-col">
                    <label for="exercise-angina" class="mb-2 font-medium text-slate-300">Exercise Angina</label>
                    <select id="exercise-angina" name="ExerciseAngina" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="N">No</option>
                        <option value="Y">Yes</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label for="oldpeak" class="mb-2 font-medium text-slate-300">Oldpeak</label>
                    <input type="number" step="0.1" id="oldpeak" name="Oldpeak" placeholder="e.g., 1.5" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                </div>

                <div class="flex flex-col">
                    <label for="st-slope" class="mb-2 font-medium text-slate-300">ST Slope</label>
                    <select id="st-slope" name="ST_Slope" class="bg-slate-700/50 border border-slate-600 rounded-lg p-3 focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition duration-300">
                        <option value="Up">Up-sloping</option>
                        <option value="Flat">Flat</option>
                        <option value="Down">Down-sloping</option>
                    </select>
                </div>

            </div>

            <div class="flex justify-center pt-6">
                <button type="submit" class="w-full md:w-auto bg-gradient-to-r from-red-500 to-red-600 text-white font-bold py-3 px-12 rounded-lg shadow-lg hover:shadow-red-500/50 transform hover:scale-105 transition-all duration-300 ease-in-out">
                    Submit
                </button>
            </div>
        </form>
    </div>
</body>
</html>
